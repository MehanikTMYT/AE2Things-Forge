// Fleet port to Minecraft 26.1.2 (2026-10-10): ModDevGradle 2.0.141, Java 25, NeoForge 26.1.2.114, our AE2 26.1 fork and
// EMI from mavenLocal. CurseForge upload and spotless plugins dropped (Gradle 9). Originals in .fleet-orig/.
plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = "dev.technici4n"
version = System.getenv("AE2THINGS_VERSION") ?: "1.4.2-beta+26.1.2"

repositories {
    mavenLocal()
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")
    }
}

configurations {
    localRuntimeOnly
    runtimeClasspath.extendsFrom localRuntimeOnly
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

sourceSets {
    main {
        resources {
            srcDir("src/generated/resources")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes("Implementation-Version": version)
    }
}

neoForge {
    version = neoforge_version
    mods {
        ae2things {
            sourceSet project.sourceSets.main
        }
    }
    runs {
        configureEach {
            jvmArgument '-Xmx2g'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', "ae2things", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
